<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>CRAFT</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.css" integrity="sha512-kJlvECunwXftkPwyvHbclArO8wszgBGisiLeuDFwNM8ws+wKIw0sv1os3ClWZOcrEB2eRXULYUsm8OVRGJKwGA==" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@dong-gri/kineto/dist/kineto.min.css">
  <link rel="stylesheet" href="./commons.css">
  <style>
    /* ===== 페이지 ===== */
    html {
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, "Helvetica Neue", "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
      color: var(--uact-text-primary);
      line-height: 150%;
      letter-spacing: -0.035em;
      background: var(--uact-canvas);
    }

    div.wrap {
      column-count: 5;
      column-gap: 8px;
    }

    div.divider {
      display: inline-block;
      width: 100%;
      margin: 0 0 8px;
      padding: 16px;
      box-sizing: border-box;
      border-radius: 10px;
      background: var(--uact-surface);
      vertical-align: top;
      break-inside: avoid;
    }

    @media (max-width: 1280px) {
      div.wrap {
        column-count: 3;
      }
    }

    @media (max-width: 760px) {
      div.wrap {
        column-count: 1;
      }
    }

    h4.divider {
      font-size: 16px;
      line-height: 1;
      margin: 0 0 16px 0;
      padding: 16px 8px;
      font-weight: 600;
      border-bottom: 1px solid var(--uact-border);
    }

    div.divider div.container {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 16px;
    }

     div.divider div.container:last-of-type {
      margin-bottom: 0;
     }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="divider">
      <h4 class="divider">공통 패널 서브타이틀</h4>
      <div class="container">
        <section class="uact-lnb__section">
          <button type="button" class="uact-lnb__subtitle">
            <span class="uact-lnb__step">3</span>
            <span class="uact-lnb__step-label">크리에이티브</span>
          </button>
        </section>
      </div>
      <div class="container">
        <section class="uact-lnb__section">
          <button type="button" class="uact-lnb__subtitle uact-lnb__subtitle--toggle is-open">
            <span class="uact-lnb__step">3</span>
            <span class="uact-lnb__step-label">크리에이티브</span>
          </button>
        </section>
      </div>
    </div>


    <div class="divider">
      <h4 class="divider">공통 INPUT / DROPDOWN</h4>
      <div class="container">
        <label class="uact-field">
          <span class="uact-field__label">INPUT SM</span>
          <div class="uact-input__group" data-size="sm">
            <input class="select__search-input" placeholder="PlaceHolder" value="">
          </div>
        </label>
        <label class="uact-field">
          <span class="uact-field__label">INPUT MD</span>
          <div class="uact-input__group" data-size="md">
            <input class="select__search-input" placeholder="PlaceHolder" value="">
          </div>
        </label>
        <label class="uact-field">
          <span class="uact-field__label">INPUT LG</span>
          <div class="uact-input__group" data-size="lg">
            <input class="select__search-input" placeholder="PlaceHolder" value="">
          </div>
        </label>
      </div>

      <div class="container">
        <label class="uact-field">
          <span class="uact-field__label">Selectbox SM</span>
          <div class="uact-input__group" data-size="sm">
            <button type="button" class="select__button" role="combobox" aria-haspopup="listbox" aria-expanded="true" aria-label="국가 및 권역" aria-controls=":r18:-list" aria-activedescendant=":r18:-list-0"><span class="select__value">전세계</span></button>
          </div>
        </label>
        <label class="uact-field">
          <span class="uact-field__label">Selectbox MD</span>
          <div class="uact-input__group" data-size="md">
            <button type="button" class="select__button" role="combobox" aria-haspopup="listbox" aria-expanded="true" aria-label="국가 및 권역" aria-controls=":r18:-list" aria-activedescendant=":r18:-list-0"><span class="select__value">전세계</span></button>
          </div>
        </label>
        <label class="uact-field">
          <span class="uact-field__label">Selectbox LG</span>
          <div class="uact-input__group" data-size="lg">
            <button type="button" class="select__button is-open" role="combobox" aria-haspopup="listbox" aria-expanded="true" aria-label="국가 및 권역" aria-controls=":r18:-list" aria-activedescendant=":r18:-list-0"><span class="select__value">전세계</span></button>
          </div>
        </label>
      </div>

      <div class="container">
        <ul id=":r18:-list" role="listbox" class="select__list" style="max-height: 180px;" data-size="md">
          <li id=":r18:-list-0" data-index="0" role="option" aria-selected="false" class="select__option">
            <span class="select__option-text">
              <span class="select__option-label">전세계</span>
            </span>
          </li>
          <li id=":r18:-list-1" data-index="1" role="option" aria-selected="false" class="select__option">
            <span class="select__option-text">
              <i class="ri-image-line"></i>
              <span class="select__option-label">아이콘 같이 있을 경우</span>
            </span>
          </li>
          <li id=":r18:-list-2" data-index="2" role="option" aria-selected="true" class="select__option is-active is-selected">
            <span class="select__option-text">
              <span class="select__option-label">대만</span>
            </span>
          </li>
          <li id=":r18:-list-3" data-index="3" role="option" aria-selected="false" class="select__option">
            <span class="select__option-text">
              <span class="select__option-label">독일</span>
            </span>
          </li>
          <li id=":r18:-list-4" data-index="4" role="option" aria-selected="false" class="select__option">
            <span class="select__option-text">
              <span class="select__option-label">멕시코</span>
            </span>
          </li>
          <li id=":r18:-list-5" data-index="5" role="option" aria-selected="false" class="select__option">
            <span class="select__option-text">
              <span class="select__option-label">미국</span>
            </span>
          </li>
          <li id=":r18:-list-6" data-index="6" role="option" aria-selected="false" class="select__option">
            <span class="select__option-text">
              <span class="select__option-label">브라질</span>
            </span>
          </li>
          <li id=":r18:-list-7" data-index="7" role="option" aria-selected="false" class="select__option">
            <span class="select__option-text">
              <span class="select__option-label">영국</span>
            </span>
          </li>
          <li id=":r18:-list-8" data-index="8" role="option" aria-selected="false" class="select__option">
            <span class="select__option-text">
              <span class="select__option-label">인도네시아</span>
            </span>
          </li>
          <li id=":r18:-list-9" data-index="9" role="option" aria-selected="false" class="select__option">
            <span class="select__option-text">
              <span class="select__option-label">중국</span>
            </span>
          </li>
          <li id=":r18:-list-10" data-index="10" role="option" aria-selected="false" class="select__option">
            <span class="select__option-text">
              <span class="select__option-label">캐나다</span>
            </span>
          </li>
          <li id=":r18:-list-11" data-index="11" role="option" aria-selected="false" class="select__option">
            <span class="select__option-text">
              <span class="select__option-label">태국</span>
            </span>
          </li>
          <li id=":r18:-list-12" data-index="12" role="option" aria-selected="false" class="select__option">
            <span class="select__option-text">
              <span class="select__option-label">프랑스</span>
            </span>
          </li>
          <li id=":r18:-list-13" data-index="13" role="option" aria-selected="false" class="select__option">
            <span class="select__option-text">
              <span class="select__option-label">홍콩</span>
            </span>
          </li>
        </ul>
      </div>

      <div class="container">
        <span class="uact-field__label">DROPDOWN</span>
        <button class="btn btn--primary btn-rounded btn--dropdown" data-size="md">다운로드</button>
      </div> 
    </div>

    <div class="divider">
      <h4 class="divider">BUTTON</h4>
      <div class="container">
        <span class="uact-field__label">BUTTON</span>
        <button class="btn btn--primary" data-size="md"><i class="ri-upload-2-line"></i> Primary</button>
        <button class="btn btn--secondary" data-size="md">Secondary</button>
        <button class="btn btn--tertiary" data-size="md">Tertiary</button>
        <button class="btn btn--transparent" data-size="md">transparent</button>
        <button class="btn btn--outline" data-size="md">Outline</button>
        <button class="btn btn--outline-yellow" data-size="md">Outline Yellow</button>
      </div>

      <div class="container">
        <span class="uact-field__label">BUTTON SIZE</span>
        <button class="btn btn--primary" data-size="sm">SM</button>
        <button class="btn btn--primary" data-size="md">MD</button>
        <button class="btn btn--primary" data-size="lg">LG</button>
      </div>

      <div class="container">
        <span class="uact-field__label">BUTTON ROUNDED</span>
        <button class="btn btn--primary btn-rounded" data-size="md"><i class="ri-upload-2-line"></i> Primary</button>
        <button class="btn btn--secondary btn-rounded" data-size="md">Secondary</button>
        <button class="btn btn--tertiary btn-rounded" data-size="md">Tertiary</button>
        <button class="btn btn--transparent btn-rounded" data-size="md">transparent</button>
        <button class="btn btn--outline btn-rounded" data-size="md">Outline</button>
      </div>


      <div class="container">
        <span class="uact-field__label">BUTTON GROUP</span>
        <div class="uact-vgroup">
          <span class="uact-vgroup__label">해상도</span>
          <div class="uact-segmented uact-segmented--quality" role="radiogroup" aria-label="해상도" data-size="md">
            <button type="button" role="radio" aria-checked="false" class="btn btn--tertiary">Standard (720p)</button>
            <button type="button" role="radio" aria-checked="true" class="btn btn--tertiary is-active">High (1080p)</button>
          </div>
        </div>
      </div>
    </div>


    <div class="divider">
      <h4 class="divider">RADIO / CHECKBOX</h4>
      <div class="container">
        <label class="uact-checkbox checkbox--normal"><input type="checkbox"><span class="uact-floatbar__box" aria-hidden="true"></span>텍스트 없는 이미지 함께 생성<b class="-">본판 동봉</b></label>
        <label class="uact-checkbox checkbox--multicheck"><input type="checkbox"><span>원형 모양의 다중 체크박스</span></label>
      </div>
    </div>

    <div class="divider">
      <h4 class="divider">ACTION</h4>
      <div class="container">
        <div class="uact-action">
          <div class="uact-stepper">
            <button type="button" disabled aria-label="세트 수 감소"><i class="ri-subtract-line"></i></button>
            <input type="text" class="uact-stepper__value" value="1" min="1">
            <button type="button" aria-label="세트 수 증가"><i class="ri-add-line"></i></button>
          </div>
          <button type="button" class="uact-submit btn btn--primary btn-rounded" data-size="lg">생성</button>
        </div>

        <div class="uact-action">
          <div class="uact-stepper">
            <button type="button" disabled aria-label="세트 수 감소"><i class="ri-subtract-line"></i></button>
            <input type="text" disabled class="uact-stepper__value" value="1" min="1">
            <button type="button" disabled aria-label="세트 수 증가"><i class="ri-add-line"></i></button>
          </div>
          <button type="button" class="uact-submit btn btn--primary btn-rounded" disabled data-size="lg">생성</button>
        </div>
      </div>
    </div>

  </div>  
</body>
</html>
