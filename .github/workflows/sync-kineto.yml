name: Sync verified Kineto demo

on:
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: read

concurrency:
  group: sync-verified-kineto-demo
  cancel-in-progress: true

jobs:
  resolve:
    name: Resolve the verified tip of Kineto main
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      source-sha: ${{ steps.source.outputs.sha }}

    steps:
      # Publish only the current tip of main, and only once that exact commit's
      # push CI has passed. The old step trusted "the latest successful run",
      # which can answer with an older run: on 2026-09-29 it returned an August
      # commit and the backup went back to v0.8.104. The tip comes from git
      # itself, and its CI run is looked up by exact SHA, so the backup can lag
      # behind main while CI runs but can never move backwards.
      - name: Resolve the tip and its push CI
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tip="$(git ls-remote https://github.com/catgarret/kineto.git refs/heads/main | cut -f1)"
          if ! [[ "$tip" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Could not resolve the tip of Kineto main."
            exit 1
          fi
          response="$(curl --fail-with-body --silent --show-error \
            --retry 3 --retry-all-errors --connect-timeout 10 --max-time 30 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/catgarret/kineto/actions/workflows/ci.yml/runs?head_sha=$tip&branch=main&event=push&per_page=20")"
          passed="$(jq -r --arg sha "$tip" \
            '[.workflow_runs[] | select(.head_sha == $sha and .conclusion == "success")] | length' <<<"$response")"
          if [ "$passed" = "0" ]; then
            echo "main ${tip:0:7} has no successful push CI yet; the backup is left as it is."
            exit 0
          fi
          printf 'sha=%s\n' "$tip" >> "$GITHUB_OUTPUT"

  build:
    name: Build the verified Kineto commit
    needs: resolve
    if: needs.resolve.outputs.source-sha != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      source-sha: ${{ needs.resolve.outputs.source-sha }}

    steps:
      - name: Checkout the verified Kineto source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: catgarret/kineto
          ref: ${{ needs.resolve.outputs.source-sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Build and verify the demo artifact
        run: |
          set -euo pipefail
          npm ci --prefer-offline --fetch-retries=3 --fetch-retry-mintimeout=1000 --fetch-retry-maxtimeout=5000 --fetch-timeout=30000
          npm run build
          npm run test:site

      - name: Upload the verified demo artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: verified-kineto-site
          path: site/
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  sync:
    name: Replace only the Kineto backup
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout public site
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: master

      - name: Download the verified demo artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: verified-kineto-site
          path: .kineto-site

      - name: Replace only the Kineto backup directory
        run: |
          set -euo pipefail
          test -f .kineto-site/index.html
          if find .kineto-site -type l -print -quit | grep -q .; then
            echo "The verified demo artifact must not contain symbolic links."
            exit 1
          fi
          mkdir -p example/kineto
          rsync -a --delete .kineto-site/ example/kineto/

      - name: Commit and push when verified content changed
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.build.outputs.source-sha }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- example/kineto)" ]; then
            echo "Kineto backup already matches $SOURCE_SHA."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- example/kineto
          git commit -m "deploy: sync Kineto demo from ${SOURCE_SHA:0:7}"
          git push origin master
